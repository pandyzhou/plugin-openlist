plugins {
    id 'java'
}

group = 'run.halo.openlist'
version = '1.1.3'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://s01.oss.sonatype.org/content/repositories/releases' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
}

configurations.all {
    resolutionStrategy {
        force 'org.slf4j:slf4j-api:2.0.17'
    }
}

dependencies {
    compileOnly 'run.halo.app:api:2.22.11'
    compileOnly 'org.springframework:spring-web:7.0.3'
    compileOnly 'org.springframework:spring-webflux:7.0.3'
    compileOnly 'org.springframework:spring-context:7.0.3'
    compileOnly 'io.projectreactor:reactor-core:3.7.6'
    compileOnly 'org.pf4j:pf4j:3.15.0'
}

test {
    failOnNoDiscoveredTests = false
}

tasks.register('pathEncoderTest', JavaExec) {
    group = 'verification'
    description = 'Runs OpenList path encoder regression checks.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'run.halo.openlist.OpenListPathEncoderTest'
    dependsOn testClasses
}

tasks.register('propertiesResolverTest', JavaExec) {
    group = 'verification'
    description = 'Runs OpenList properties resolver regression checks.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'run.halo.openlist.OpenListPropertiesResolverTest'
    dependsOn testClasses
}

jar {
    manifest {
        attributes 'Plugin-Id': 'plugin-openlist',
                   'Plugin-Version': version
    }
}
